<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CubeZixONE · 15 s release</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.min.css">
<link rel="stylesheet" href="../assets/css/home2.min.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#F6F7FB;font-family:"Inter Tight",sans-serif;color:#14163F}
#stage *{box-sizing:border-box}
#stage *,#stage *::before,#stage *::after{animation:none!important;transition:none!important}
#stage svg{max-width:none}
/* one typeface everywhere, including the product UI */
#stage .ed,#stage .ed *{font-family:"Inter Tight",sans-serif!important}
/* the blue object is the only active marker in the side nav */
#dash .ed-nav button.on{background:transparent!important;color:inherit!important;box-shadow:none!important}
#dash .ed-nav button.on svg{color:inherit!important}
.abs{position:absolute}
#view{position:absolute;inset:0;background:#F1F2F8}
#world{position:absolute;left:0;top:0;width:1560px;height:860px;transform-origin:0 0}
#dash{position:absolute;left:0;top:0;width:1560px;height:860px;border-radius:30px;overflow:hidden}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .12em;margin:0 -.02em -.12em}
.w>span{display:inline-block}
.line{position:absolute;white-space:nowrap;font-weight:500;letter-spacing:-.045em;line-height:1.02}
.k{color:#3A4CE1}
#obj{position:absolute;left:0;top:0;background:#3A4CE1;color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:500;z-index:30}
#obj .lb{position:absolute;left:0;right:0;top:50%;text-align:center;white-space:nowrap}
#card{position:absolute;left:480px;top:330px;width:960px;height:470px;border-radius:40px;background:#fff;box-shadow:0 40px 80px -50px rgba(20,22,63,.45);padding:52px 56px;transform-origin:50% 50%}
#cursor{position:absolute;left:0;top:0;z-index:40}
#cursor svg{position:absolute;left:-8px;top:-7px;width:100px;height:120px;filter:drop-shadow(0 8px 14px rgba(10,12,46,.3))}
#endc{position:absolute;inset:0;transform-origin:50% 50%}
</style>
</head>
<body>
<div id="stage">
  <div id="view"><div id="world"><div id="dash"></div></div></div>
  <div id="cardWrap" class="abs" style="inset:0"><div id="card"></div></div>
  <div id="copy" class="abs" style="inset:0"></div>
  <div id="endc"></div>
  <div id="obj"><div class="lb" id="lbA"></div><div class="lb" id="lbB"></div></div>
  <div id="cursor"><svg viewBox="0 0 44 52"><path d="M4 2 L4 38 L13 30 L20 46 L27 43 L20 28 L33 28 Z" fill="#14163F" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>
</div>
<script>
(() => {
const W = 1920, H = 1080, BEAT = 0.5, DUR = 15, INK = '#14163F', ACC = '#3A4CE1';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const expo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const eio = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
// damped spring, time in seconds since start; zeta .75 -> ~3% overshoot
const spring = (dt, w = 13, z = 0.75) => { if (dt <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt)); };
const $ = (s, r = document) => r.querySelector(s);
const world = $('#world'), dash = $('#dash'), view = $('#view'), obj = $('#obj'), lbA = $('#lbA'), lbB = $('#lbB'), copy = $('#copy'), card = $('#card'), endc = $('#endc'), cursorEl = $('#cursor');
let MODS = null, LOGO = '', curMod = -1;
const fitHTML = (h) => `<div style="width:1180px;height:650px;transform-origin:0 0;transform:scale(1.322)">${h}</div>`;

/* ---------------- copy (each word masked; outgoing and incoming text timed apart) ---------------- */
const LINES = [];
const addLine = (words, x, y, size, tin, tout, dir = 1) => {
  const n = document.createElement('div'); n.className = 'line'; n.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px`;
  n.innerHTML = words.map((w) => `<span class="w"><span class="${w[1] ? 'k' : ''}">${w[0]}</span></span>`).join(' ');
  copy.appendChild(n);
  const spans = [...n.querySelectorAll('.w>span')];
  LINES.push({ n, spans, tin, tout, dir });
  return n;
};
// hook: one word per beat; "apps." is knocked out by the ONE tag
const hook = addLine([['Too'], ['many'], ['apps.']], 160, 380, 230, [0.0, 0.5, 1.0], [2.0, 2.06, 1.5]);
addLine([['Eight'], ['modules.']], 1090, 400, 110, [3.0, 3.06], [5.5, 5.56]);
addLine([['One', 1], ['ERP.']], 1090, 520, 110, [3.5, 3.56], [5.62, 5.68]);
addLine([['Only'], ['decisions', 1], ['reach'], ['you.']], 160, 120, 104, [7.0, 7.05, 7.1, 7.15], [8.5, 8.54, 8.58, 8.62]);
addLine([['See'], ['the'], ['whole', 1]], 140, 410, 120, [10.0, 10.05, 10.1], [11.5, 11.54, 11.58]);
addLine([['business.']], 140, 540, 120, [10.5], [11.62]);
addLine([['Run'], ['your'], ['whole'], ['company'], ['from'], ['ONE', 1], ['ERP.']], 160, 110, 104, [12.5, 12.54, 12.58, 12.62, 12.66, 12.7, 12.74], [13.0, 13.03, 13.06, 13.09, 13.12, 13.15, 13.18]);

/* ---------------- decision card (the site's "needs you" component) ---------------- */
card.innerHTML = `<div style="display:flex;align-items:center;gap:18px"><div style="width:64px;height:64px;border-radius:20px;background:#EEF0FF;display:grid;place-items:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A4F86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v10H3zM3 11h18M7 15h3"/></svg></div><div style="font-size:30px;color:#6A6E9A">Payroll · 09:41</div><div id="chipSlot" style="margin-left:auto;width:220px;height:58px"></div></div>
  <div style="position:relative;height:150px;margin-top:34px;overflow:hidden"><div id="ttlA" style="position:absolute;left:0;top:0;font-size:62px;font-weight:500;letter-spacing:-.04em;line-height:1.08;width:820px">1 employee is missing bank details</div><div id="ttlB" style="position:absolute;left:0;top:0;font-size:62px;font-weight:500;letter-spacing:-.04em;line-height:1.08">Bank details added</div></div>
  <div style="position:absolute;left:56px;right:56px;bottom:48px;display:flex;align-items:center;gap:16px"><div style="width:54px;height:54px;border-radius:27px;background:#EEF0FF;display:grid;place-items:center;font-size:20px;font-weight:500;color:#4A4F86">HN</div><div style="font-size:28px;color:#6A6E9A">Requested by Hana, Payroll</div><div id="review" style="margin-left:auto;width:200px;height:72px;border-radius:999px;background:${INK};color:#fff;display:grid;place-items:center;font-size:30px;font-weight:500">Review</div></div>`;

/* ---------------- end card ---------------- */
const buildEnd = () => {
  endc.innerHTML = `<div id="logo" class="abs" style="left:430px;top:381px;width:230px;height:318px"><svg viewBox="0 0 460 640" width="230" height="318">${LOGO}</svg></div>
  <div class="line" id="endName" style="left:720px;top:420px;font-size:170px"><span class="w"><span>CubeZix<span class="k">ONE</span></span></span></div>
  <div class="line" id="endUrl" style="left:728px;top:612px;font-size:46px;font-weight:400;letter-spacing:-.02em;color:#6A6E9A"><span class="w"><span>ONE ERP · cubezixone.com</span></span></div>`;
};

/* ---------------- measured geometry (world space, measured once at load) ---------------- */
const G = {};
const measure = () => {
  world.style.transform = 'none'; view.style.clipPath = 'none';
  dash.innerHTML = fitHTML(MODS['0']);
  G.tabs = [...dash.querySelectorAll('.ed-nav button')].map((b) => { const r = b.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; });
  const nv = dash.querySelector('.ed-side').getBoundingClientRect(); G.nav = { x: nv.left, y: nv.top, w: nv.width, h: nv.height };
  dash.innerHTML = fitHTML(MODS['3']);
  const ch = dash.querySelector('.ed-ch').getBoundingClientRect(); G.chart = { x: ch.left, y: ch.top, w: ch.width, h: ch.height };
  const bars = dash.querySelectorAll('.ed-bars u'); const lb = bars[bars.length - 1].getBoundingClientRect(); G.bar = { x: lb.left, y: lb.top, w: lb.width, h: lb.height };
  curMod = 3;
};

/* ---------------- camera: world point F sits at screen anchor A, scale s ---------------- */
const CAMS = () => {
  const t0 = G.tabs[0], t7 = G.tabs[G.tabs.length - 1], tabsH = t7.y + t7.h - t0.y;
  const s1 = Math.min(3.2, 700 / tabsH), F1 = [t0.x + t0.w / 2, t0.y + tabsH / 2], A1 = [540, 540];
  const s3 = 900 / G.chart.w, F3 = [G.chart.x + G.chart.w / 2, G.chart.y + G.chart.h / 2], A3 = [1330, 540];
  const s5 = 0.84, F5 = [780, 430], A5 = [960, 672];
  return { s1, F1, A1, s3, F3, A3, s5, F5, A5 };
};
let C = null;
const cam = (t) => {
  const { s1, F1, A1, s3, F3, A3, s5, F5, A5 } = C;
  const m1 = [s1 * (1 + 0.04 * seg(t, 2, 6)), F1, A1];
  const m3 = [s3 * (1 + 0.04 * seg(t, 9, 12)), F3, A3];
  if (t < 6.2) return m1;
  if (t < 9.0) { const p = eio(seg(t, 6.2, 8.9)); const a = [s1 * 1.04, F1, A1]; return [lerp(a[0], s3, p), [lerp(F1[0], F3[0], p), lerp(F1[1], F3[1], p)], [lerp(A1[0], A3[0], p), lerp(A1[1], A3[1], p)]]; }
  if (t < 12.0) return m3;
  const p = spring(t - 12.0, 9, 0.85), push = 1 + 0.04 * seg(t, 12.0, 15);
  return [lerp(s3 * 1.04, s5 * push, p), [lerp(F3[0], F5[0], p), lerp(F3[1], F5[1], p)], [lerp(A3[0], A5[0], p), lerp(A3[1], A5[1], p)]];
};
const toScreen = (r, cm) => { const [s, F, A] = cm; return { x: A[0] + s * (r.x - F[0]), y: A[1] + s * (r.y - F[1]), w: r.w * s, h: r.h * s }; };

/* ---------------- helpers ---------------- */
const lerpR = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), w: lerp(a.w, b.w, p), h: lerp(a.h, b.h, p), r: lerp(a.r ?? 0, b.r ?? 0, p) });
const pt = (x, y) => ({ x, y, w: 0, h: 0, r: 0 });
const rectOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; };
const clipR = (R, rad) => `inset(${R.y}px ${W - R.x - R.w}px ${H - R.y - R.h}px ${R.x}px round ${rad}px)`;
const MOD_NAMES = ['Finance', 'Sales', 'CRM', 'Inventory'];
const TAB_T = [0, 4.0, 4.5, 5.0];
const activeTab = (t) => { let k = 0; TAB_T.forEach((tt, i) => { if (t >= tt) k = i; }); return k; };
const CLICKS = [1.5, 4.0, 4.5, 5.0, 8.0];
window.CLICKS = CLICKS;

/* labels inside the object: outgoing then incoming, never overlapping */
const LBL = [[-1, 'ONE'], [2.0, 'Finance'], [4.0, 'Sales'], [4.5, 'CRM'], [5.0, 'Inventory'], [6.0, 'Needs you'], [8.0, 'Done'], [9.0, '']];
const setLabels = (t, size) => {
  let i = 0; LBL.forEach((l, k) => { if (t >= l[0]) i = k; });
  const [t0, txt] = LBL[i], prev = i > 0 ? LBL[i - 1][1] : '';
  const pOut = seg(t, t0, t0 + 0.12), pIn = expo(seg(t, t0 + 0.12, t0 + 0.34));
  lbA.textContent = prev; lbB.textContent = txt;
  lbA.style.fontSize = lbB.style.fontSize = size + 'px';
  lbA.style.transform = `translateY(${-50 - pOut * 160}%)`; lbA.style.display = i > 0 && pOut < 1 ? 'block' : 'none';
  lbB.style.transform = `translateY(${-50 + (1 - pIn) * 160}%)`;
};

/* ---------------- cursor path ---------------- */
let appsC = [1500, 520];
const curWP = (t, cm) => {
  const tab = (k) => { const r = toScreen(G.tabs[k], cm); return [r.x + r.w * 0.55, r.y + r.h * 0.5]; };
  const bar = () => { const r = toScreen(G.bar, cam(t)); return [r.x + r.w / 2, r.y + r.h * 0.4]; };
  const rv = () => { const r = rectOf($('#review')); return [r.x + r.w * 0.55, r.y + r.h * 0.55]; };
  return [[0, () => [2100, 980]], [1.45, () => appsC], [1.95, () => appsC], [3.7, () => tab(1)], [4.0, () => tab(1)], [4.5, () => tab(2)], [5.0, () => tab(3)], [5.6, () => [1180, 860]],
    [7.6, () => rv()], [8.0, () => rv()], [8.6, () => [1500, 940]], [10.9, () => bar()], [11.6, () => bar()], [12.4, () => [2100, 1180]]];
};
const curPos = (t, cm) => {
  const WP = curWP(t, cm);
  if (t <= WP[0][0]) return WP[0][1]();
  for (let i = 0; i < WP.length - 1; i++) {
    const a = WP[i], b = WP[i + 1];
    if (t <= b[0]) { const u = eio(seg(t, a[0], b[0])), A = a[1](), B = b[1](); const arc = Math.sin(Math.PI * u) * Math.min(90, Math.hypot(B[0] - A[0], B[1] - A[1]) * 0.08); return [lerp(A[0], B[0], u), lerp(A[1], B[1], u) - arc]; }
  }
  return WP[WP.length - 1][1]();
};

/* ======================= render ======================= */
function render(t) {
  const cm = cam(t), [s, F, A] = cm;
  world.style.transform = `translate(${A[0] - s * F[0]}px,${A[1] - s * F[1]}px) scale(${s})`;

  /* module follows the clicked tab (real markup per module), wiped in from the left */
  const k = activeTab(t);
  if (k !== curMod) { curMod = k; dash.innerHTML = `<div class="prev" style="position:absolute;inset:0">${fitHTML(MODS[String(Math.max(0, k - 1))])}</div><div class="cur" style="position:absolute;inset:0">${fitHTML(MODS[String(k)])}</div>`; }
  const wp = k === 0 ? 1 : expo(seg(t, TAB_T[k] + 0.05, TAB_T[k] + 0.45)); const cur = dash.querySelector('.cur'); if (cur) cur.style.clipPath = `inset(0 ${(1 - wp) * 100}% 0 0)`;

  /* copy */
  LINES.forEach((L) => {
    L.spans.forEach((sp, i) => {
      const pin = expo(seg(t, L.tin[i], L.tin[i] + 0.38)), pout = expo(seg(t, L.tout[i], L.tout[i] + 0.3));
      const down = L === LINES[0] && i === 2; // "apps." is knocked downwards
      sp.style.transform = `translateY(${(1 - pin) * 115 + (down ? pout * 125 : -pout * 125)}%)`;
    });
  });
  const ar = LINES[0].spans[2].parentNode.getBoundingClientRect(); appsC = [ar.left + ar.width * 0.4, ar.top + ar.height * 0.55];

  /* card */
  const cardPush = 1 + 0.04 * seg(t, 6.0, 9.0);
  card.style.transform = `scale(${cardPush})`;
  const slotR = rectOf($('#chipSlot'));
  const cr = rectOf(card);
  const unf = spring(t - 6.25, 12, 0.8), fold = spring(t - 8.9, 14, 0.9);
  const cp = clamp(unf - fold, 0, 1);
  card.style.display = t > 6.2 && t < 9.25 ? 'block' : 'none';
  const sx = (slotR.x - cr.x) / cardPush, sy = (slotR.y - cr.y) / cardPush, cw = 960, chh = 470;
  card.style.clipPath = `inset(${lerp(sy, 0, cp)}px ${lerp(cw - sx - 220, 0, cp)}px ${lerp(chh - sy - 58, 0, cp)}px ${lerp(sx, 0, cp)}px round ${lerp(29, 40, cp)}px)`;
  const dn = seg(t, 8.05, 8.2), dnIn = expo(seg(t, 8.2, 8.45));
  $('#ttlA').style.transform = `translateY(${-dn * 170}px)`; $('#ttlB').style.transform = `translateY(${(1 - dnIn) * 170}px)`;
  $('#review').style.transform = `scale(${1 - 0.06 * Math.sin(Math.PI * seg(t, 8.0, 8.25))})`;

  /* the through-line object: tag -> module tab -> "needs you" chip -> chart bar -> logo */
  const cpos = curPos(t, cm);
  const tag = { x: cpos[0] + 40, y: cpos[1] + 86, w: 190, h: 84, r: 28 };
  const tabR = (i) => ({ ...toScreen(G.tabs[i], cm), r: 14 * s });
  const pill = (() => { // slides between tabs with a spring
    let r = tabR(0);
    for (let i = 1; i < 4; i++) if (t >= TAB_T[i]) r = lerpR(r, tabR(i), clamp(spring(t - TAB_T[i], 16, 0.8), 0, 1.03));
    return r;
  })();
  const chip = { ...slotR, r: 29 * cardPush };
  const barR = { ...toScreen(G.bar, cm), r: 6 * s };
  const dot = { x: 1330 - 14, y: 540 - 14, w: 28, h: 28, r: 14 };
  const logoSq = { x: 445, y: 430, w: 200, h: 200, r: 56 };
  let R, fs = 44;
  if (t < 2.0) R = tag;
  else if (t < 6.0) { R = lerpR(tag, pill, clamp(spring(t - 2.0, 11, 0.8), 0, 1.03)); fs = lerp(44, 13 * s * 1.3, seg(t, 2.0, 2.3)); }
  else if (t < 9.0) { R = lerpR(pill, chip, clamp(spring(t - 6.0, 11, 0.8), 0, 1.03)); fs = lerp(13 * s * 1.3, 28, seg(t, 6.0, 6.3)); }
  else if (t < 9.45) R = lerpR(chip, dot, clamp(spring(t - 9.0, 16, 0.85), 0, 1.03));
  else if (t < 13.0) R = lerpR(dot, barR, clamp(spring(t - 9.45, 12, 0.8), 0, 1.03));
  else R = lerpR(barR, logoSq, clamp(spring(t - 13.0, 10, 0.8), 0, 1.03));
  const vanish = spring(t - 13.45, 12, 0.9); // the square hands over to the logo mark
  const sc = t > 13.45 ? clamp(1 - vanish, 0, 1) : 1;
  obj.style.left = R.x + 'px'; obj.style.top = R.y + 'px'; obj.style.width = Math.max(0, R.w) + 'px'; obj.style.height = Math.max(0, R.h) + 'px';
  obj.style.borderRadius = Math.min(R.r, R.h / 2) + 'px'; obj.style.transform = `scale(${sc})`; obj.style.transformOrigin = '50% 50%';
  obj.style.display = sc <= 0.01 ? 'none' : 'flex';
  setLabels(t, fs);

  /* the view (product window): opened, reshaped and closed by the object */
  const R1 = { x: 80, y: 80, w: 920, h: 920 }, R3 = { x: 820, y: 120, w: 1020, h: 840 }, R5 = { x: 160, y: 300, w: 1600, h: 740 };
  let V, vr = 36;
  const tagPt = pt(tag.x + tag.w / 2, tag.y + tag.h / 2);
  if (t < 2.0) V = tagPt;
  else if (t < 6.0) V = lerpR(tagPt, R1, clamp(spring(t - 2.0, 10, 0.85), 0, 1.02));
  else if (t < 9.1) V = lerpR(R1, pill, clamp(spring(t - 6.0, 12, 0.9), 0, 1));
  else if (t < 12.0) V = lerpR(pt(dot.x + 14, dot.y + 14), R3, clamp(spring(t - 9.1, 10, 0.85), 0, 1.02));
  else if (t < 13.0) V = lerpR(R3, R5, clamp(spring(t - 12.0, 10, 0.85), 0, 1.02));
  else V = lerpR(R5, pt(barR.x + barR.w / 2, barR.y + barR.h / 2), clamp(spring(t - 13.0, 12, 0.9), 0, 1));
  const hidden = (t >= 6.0 && t < 9.1 && seg(t, 6.0, 6.6) >= 1) || V.w < 1;
  view.style.display = hidden || t < 1.99 || t > 13.55 ? 'none' : 'block';
  view.style.clipPath = clipR(V, vr);

  /* end card: the logo is revealed from the object; name and address follow on the beats */
  endc.style.display = t > 13.3 ? 'block' : 'none';
  if (t > 13.3) {
    endc.style.transform = `scale(${1 + 0.04 * seg(t, 13.3, 15)})`;
    const lg = clamp(spring(t - 13.4, 11, 0.85), 0, 1.02);
    $('#logo').style.clipPath = `circle(${lg * 200}px at 115px 159px)`;
    const nm = expo(seg(t, 14.0, 14.4)), url = expo(seg(t, 14.5, 14.85));
    $('#endName .w>span').style.transform = `translateY(${(1 - nm) * 115}%)`;
    $('#endUrl .w>span').style.transform = `translateY(${(1 - url) * 115}%)`;
  }

  /* cursor */
  const pressed = CLICKS.some((c) => t >= c && t < c + 0.22);
  cursorEl.style.display = t < 12.4 ? 'block' : 'none';
  cursorEl.style.transform = `translate(${cpos[0]}px,${cpos[1]}px) scale(${pressed ? 0.88 : 1})`;
}

/* ======================= soundtrack (OfflineAudioContext) ======================= */
window.renderAudio = async () => {
  const SR = 44100, ctx = new OfflineAudioContext(2, SR * DUR, SR);
  const out = ctx.createDynamicsCompressor(); out.threshold.value = -12; out.ratio.value = 3; out.connect(ctx.destination);
  const nb = ctx.createBuffer(1, SR, SR); const nd = nb.getChannelData(0); let sd = 7; for (let i = 0; i < nd.length; i++) { sd = (sd * 1664525 + 1013904223) % 4294967296; nd[i] = sd / 2147483648 - 1; }
  const env = (g, t, a, d, pk) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
