<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CubeZixONE film · master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=Space+Grotesk:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.min.css">
<link rel="stylesheet" href="../assets/css/home2.min.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#F4F5FF;font-family:"Inter",sans-serif;color:#14163F}
#stage *{box-sizing:border-box}
.abs{position:absolute}
/* determinism: nothing animates by itself */
#stage *,#stage *::before,#stage *::after{animation:none!important;transition:none!important}
#bgDark{position:absolute;inset:0;background:#0A0C2E}
#bgLav{position:absolute;inset:0;background:#ECEAFF}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.copy{position:absolute;font-family:"Inter Tight","Inter",sans-serif;font-weight:500;letter-spacing:-.045em;line-height:1.04}
.copy .ln{overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.copy .ln>span{display:inline-block;white-space:nowrap}
.card{position:absolute;background:#fff;border-radius:26px;border:1px solid rgba(20,22,63,.08);box-shadow:0 24px 50px -30px rgba(20,22,63,.35);overflow:hidden}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font:500 15px "Inter",sans-serif}
.win{position:absolute;border-radius:18px;background:#fff;box-shadow:0 40px 80px -36px rgba(0,0,0,.7);overflow:hidden;font-family:"Inter",sans-serif}
.win .tb{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#E9EAF3;font:500 14px "Inter",sans-serif;color:#4A4F86}
.win .tb i{width:11px;height:11px;border-radius:50%;background:#C9CBE0;display:block}
.ncard{position:absolute;width:430px;height:98px;border-radius:22px;background:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;box-shadow:0 30px 60px -30px rgba(0,0,0,.65)}
.ncard .nic{width:46px;height:46px;border-radius:14px;background:#EEF0FF;display:grid;place-items:center;flex:none}
.ncard small{display:block;font:400 15px "Inter",sans-serif;color:#7B7FA6}
.ncard b{display:block;margin-top:4px;font:500 20px "Inter",sans-serif;color:#14163F;white-space:nowrap}
.ncard em{font-style:normal;margin-left:auto;font:500 15px "Inter",sans-serif;color:#fff;background:#14163F;border-radius:999px;padding:6px 11px;flex:none}
#cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:50}
#cursor .cptr{max-width:none!important;min-width:84px;position:absolute;left:-4px;top:-3px;filter:drop-shadow(0 6px 10px rgba(10,12,46,.35))}
#cursor .ctag{position:absolute;left:30px;top:44px;background:#633ADD;color:#fff;font:500 15px "Inter",sans-serif;border-radius:10px 10px 10px 2px;padding:6px 12px;white-space:nowrap}
.ripple{position:absolute;border-radius:50%;border:2px solid #3A4CE1;pointer-events:none}
#dashWrap{position:absolute;left:0;top:0;width:1560px;height:860px;transform-origin:0 0}
#dashWrap .ed{width:1560px;height:860px;border-radius:34px;font-size:1.3em;zoom:1}

/* ---- home page look: gradient grounds, serif italic accents ---- */
#stage{background:radial-gradient(60% 50% at 50% 0%,rgba(58,76,225,.10),transparent 70%),radial-gradient(40% 45% at 92% 100%,rgba(128,209,212,.20),transparent 70%),#F4F5FF}
#bgDark,#darkTop{background:radial-gradient(55% 70% at 78% 45%,rgba(99,58,221,.38),transparent 70%),radial-gradient(45% 55% at 8% 100%,rgba(128,209,212,.16),transparent 70%),radial-gradient(40% 40% at 45% 0%,rgba(58,76,225,.28),transparent 70%),#11144A}
#lavLayer{position:absolute;inset:0;background:radial-gradient(60% 60% at 82% 0%,rgba(58,76,225,.13),transparent 70%),radial-gradient(50% 55% at 0% 100%,rgba(128,209,212,.26),transparent 70%),#ECEAFF}
#darkTop{position:absolute;inset:0}
.copy .ln>span.al,.copy .ln>span.ad{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:1.1em;letter-spacing:-.015em;line-height:.9;padding:.14em .18em .22em .06em;margin:-.14em -.18em -.22em -.06em;-webkit-background-clip:text;background-clip:text;color:transparent}
.copy .ln>span.al{background-image:linear-gradient(95deg,#80D1D4 0%,#3A4CE1 48%,#633ADD 100%)}
.copy .ln>span.ad{background-image:linear-gradient(95deg,#80D1D4 0%,#A9B3FF 55%,#B69CFF 100%)}
.copy .ln{padding-top:.1em;margin-top:-.1em}
.btn-grad{background:linear-gradient(95deg,#80D1D4 0%,#3A4CE1 62%,#633ADD 100%);color:#fff}
/* the ONE cursor: bigger, arrow and tag are one object */
#cursor .cptr{max-width:none!important;min-width:84px;position:absolute;left:-6px;top:-5px;width:84px;height:100px;filter:drop-shadow(0 8px 14px rgba(10,12,46,.4))}
#cursor .ctag{left:30px;top:64px;font:500 30px "Inter";letter-spacing:-.01em;border-radius:18px 18px 18px 4px;padding:9px 24px 10px;box-shadow:0 10px 22px -8px rgba(99,58,221,.7)}
#marq{position:absolute;border:3px solid #3A4CE1;background:rgba(58,76,225,.12);border-radius:6px;display:none}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
#bgLav{display:none}</style>
</head>
<body>
<div id="stage">
  <div id="bgDark"></div>
  <div id="bgLav"></div>
  <div id="world"></div>
  <div id="copies"></div>
  <div id="marq"></div><div id="rip"></div>
  <div id="cursor"><svg class="cptr" width="84" height="100" viewBox="0 0 44 52"><path d="M4 2 L4 38 L13 30 L20 46 L27 43 L20 28 L33 28 Z" fill="#3A4CE1" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg><div class="ctag">ONE</div></div>
  <div id="wipe" class="abs" style="inset:0;pointer-events:none"></div>
</div>
<script src="audio.js"></script>
<script>
(() => {
const W = 1920, H = 1080, BEAT = 0.5, DUR = 86;
const INK = '#14163F', NAVY = '#0A0C2E', BLUE = '#3A4CE1', VIO = '#633ADD', TEAL = '#80D1D4', LAV = '#ECEAFF', PAPER = '#F4F5FF';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eo = (p) => 1 - Math.pow(1 - p, 3);
const eio = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const expo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const sp = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-7 * p) * Math.cos(10 * p)); // restrained overshoot
const lerp = (a, b, p) => a + (b - a) * p;
const hash = (n) => { const x = Math.sin(n * 127.1 + 31.7) * 43758.5453; return x - Math.floor(x); };
const $ = (s, r = document) => r.querySelector(s);
const world = $('#world'), copiesEl = $('#copies'), stage = $('#stage');
const ico = (d, s = 26, c = '#4A4F86', w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const P = {
  sheet: 'M5 4h14v16H5zM5 10h14M5 15h14M10 4v16', calc: 'M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2zM8 7h8M8 11h2M14 11h2M8 15h2M14 15h2',
  bank: 'M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18', tasks: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2',
  folder: 'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z', mail: 'M3 6h18v12H3zM3 7l9 6 9-6', chat: 'M4 5h16v11H9l-5 4z', cal: 'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4',
  coin: 'M12 3a9 9 0 100 18 9 9 0 000-18zM9.5 9.5c.5-1 1.5-1.5 2.5-1.5 1.5 0 2.5.8 2.5 2s-1 1.6-2.5 2-2.5.8-2.5 2 1 2 2.5 2c1 0 2-.5 2.5-1.5',
  cart: 'M4 5h2l2 10h9l2-7H7M10 19h.01M16 19h.01', box: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8', pay: 'M3 7h18v10H3zM3 11h18M7 15h3',
  hr: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 3.6-7 8-7s8 3 8 7', ops: 'M4 14l4-4 3 3 5-6 4 4M4 20h16', pos: 'M4 7V5h3M17 5h3v2M4 17v2h3M17 19h3v-2M8 9v6M11 9v6M14 9v6M17 9v6',
  check: 'M5 12.5l4.5 4.5L19 7.5', arrow: 'M5 12h14M13 6l6 6-6 6',
};
const T_CLICK = { n0: 26.0, n1: 27.2, n2: 28.4, n3: 29.8, n4: 31.2, n5: 32.6, fin: 5.5, hr: 6.75, inv: 8.0, sal: 9.25, pur: 10.5, ss: 15.5, chat: 17.0, acc: 18.5, mail: 20.0, bank: 21.5, grab: 37.0, one: 43.0, review: 72.0 };
const DASH_TABS = [49.0, 51.4, 53.8, 56.2, 58.6, 61.0, 63.4, 65.8];
DASH_TABS.forEach((t, i) => { T_CLICK['tab' + i] = t; });
window.CLICKS = Object.values(T_CLICK).sort((a, b) => a - b);

/* ======================= scene DOM (built once) ======================= */
const el = (html, parent = world) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const n = d.firstChild; parent.appendChild(n); return n; };

/* ---- Ch1: five departments (independent systems) ---- */
const DEP = [
  { id: 'fin', name: 'Finance', ic: 'coin', x: 150, y: 520 },
  { id: 'hr', name: 'People', ic: 'hr', x: 500, y: 520 },
  { id: 'inv', name: 'Inventory', ic: 'box', x: 850, y: 520 },
  { id: 'sal', name: 'Sales', ic: 'cart', x: 1200, y: 520 },
  { id: 'pur', name: 'Purchasing', ic: 'tasks', x: 1550, y: 520 },
].map((d) => ({ ...d, w: 320, h: 330 }));
const depEls = {};
DEP.forEach((d) => {
  const n = el(`<div class="card" id="dep-${d.id}" style="left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px;padding:28px"></div>`);
  depEls[d.id] = n;
});
const depHTML = (id, t) => {
  const c = (k) => seg(t, T_CLICK[k], T_CLICK[k] + 0.5);
  const head = (name, ic) => `<div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:14px;background:#EEF0FF;display:grid;place-items:center">${ico(P[ic], 24)}</div><div style="font:500 24px 'Inter Tight';letter-spacing:-.03em">${name}</div></div>`;
  if (id === 'fin') {
    const inv = 38 + Math.round(eo(c('fin')) * 1);
    return head('Finance', 'coin') + `<div class="mono" style="margin-top:34px;font-size:15px;color:#7B7FA6">Collected in Nov</div><div style="margin-top:6px;font:500 56px 'Inter Tight';letter-spacing:-.05em">AED ${(1.24 + eo(c('fin')) * 0.06).toFixed(2)}M</div><div style="margin-top:20px;font:400 18px Inter;color:#6A6E9A">Invoices sent <b style="color:#14163F">${inv}</b></div><div class="chip" style="margin-top:18px;background:#E6F7EF;color:#1E9A63;opacity:${c('fin')}">${ico(P.check, 16, '#1E9A63', 2.4)} Invoice 0${inv} paid</div>`;
  }
  if (id === 'hr') {
    const ok = c('hr');
    return head('People', 'hr') + `<div style="margin-top:30px;display:grid;gap:14px">` + ['Aisha · Annual leave', 'Arjun · Sick leave', 'Sara · Day off'].map((r, i) => `<div style="display:flex;align-items:center;gap:10px;font:400 17px Inter;color:#4A4F86"><i style="width:30px;height:30px;border-radius:50%;background:#EEF0FF;display:block"></i><span style="flex:1">${r}</span>${i === 0 ? `<span class="chip" style="padding:4px 10px;font-size:13px;background:${ok > 0.5 ? '#E6F7EF' : '#F1F2FB'};color:${ok > 0.5 ? '#1E9A63' : '#6A6E9A'}">${ok > 0.5 ? 'Approved' : 'Pending'}</span>` : ''}</div>`).join('') + `</div>`;
  }
  if (id === 'inv') {
    const b = lerp(0.72, 0.38, eo(c('inv')));
    return head('Inventory', 'box') + `<div class="mono" style="margin-top:34px;font-size:15px;color:#7B7FA6">Items in stock</div><div style="margin-top:6px;font:500 56px 'Inter Tight';letter-spacing:-.05em">${(2140 - Math.round(eo(c('inv')) * 612)).toLocaleString('en-US')}</div><div style="margin-top:26px;height:16px;border-radius:8px;background:#EEF0FF"><div style="width:${b * 100}%;height:100%;border-radius:8px;background:${BLUE}"></div></div><div style="margin-top:14px;font:400 17px Inter;color:#6A6E9A">Store 2 · restock at 600</div>`;
  }
  if (id === 'sal') {
    const stg = Math.min(3, Math.floor(eo(c('sal')) * 3.01));
    const names = ['Lead', 'Quote', 'Won'];
    return head('Sales', 'cart') + `<div style="margin-top:34px;display:flex;gap:8px">` + names.map((n, i) => `<div style="flex:1;height:130px;border-radius:14px;background:#F4F5FF;padding:10px;font:500 14px Inter;color:#6A6E9A">${n}${i === Math.min(2, stg) ? `<div style="margin-top:10px;height:56px;border-radius:10px;background:${i === 2 ? '#E6F7EF' : '#fff'};border:1px solid rgba(20,22,63,.1);padding:8px;font:500 13px Inter;color:#14163F">Al Noor<br><span style="color:#7B7FA6;font-weight:400">AED 18,400</span></div>` : ''}</div>`).join('') + `</div>`;
  }
  const ap = c('pur');
  return head('Purchasing', 'tasks') + `<div class="mono" style="margin-top:34px;font-size:15px;color:#7B7FA6">Purchase orders</div><div style="margin-top:6px;font:500 56px 'Inter Tight';letter-spacing:-.05em">${14 + Math.round(ap)}</div><div style="margin-top:22px;font:400 18px Inter;color:#6A6E9A">PO-2217 · Gulf Pack</div><div class="chip" style="margin-top:14px;background:${ap > 0.5 ? '#E6F7EF' : '#F1F2FB'};color:${ap > 0.5 ? '#1E9A63' : '#6A6E9A'}">${ap > 0.5 ? ico(P.check, 16, '#1E9A63', 2.4) + ' Approved' : 'Awaiting approval'}</div>`;
};

/* ---- Ch2: the same five become separate apps (windows) ---- */
const APPS = [
  { id: 'ss', t: 'Spreadsheet · cash_flow_FINAL.xlsx', dep: 'fin', fx: 90, fy: 360, rot: -4, w: 560, h: 360, body: () => '<div style="padding:12px 16px;font:400 15px Inter;color:#4A4F86;display:grid;gap:6px">' + Array.from({ length: 8 }, (_, r) => `<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px">${[0, 1, 2].map((c) => `<div style="height:28px;background:${r === 0 ? '#DDE0F2' : '#F4F5FB'};border-radius:4px;padding:5px 8px;font-size:14px">${r === 0 ? ['Item', 'Nov', 'Dec'][c] : c === 0 ? ['Rent', 'Stock', 'Payroll', 'VAT', 'Freight', 'Fuel', 'Misc'][r - 1] : (1200 + r * 317 * (c + 1)) % 9000}</div>`).join('')}</div>`).join('') + '</div>' },
  { id: 'chat', t: 'Chat · HR group', dep: 'hr', fx: 1130, fy: 330, rot: 3, w: 470, h: 400, body: () => '<div style="padding:16px;display:grid;gap:12px;font:400 16px Inter">' + [['Fatima', 'visa photos needed by noon', 0], ['You', 'sent them yesterday?', 1], ['Aisha', 'which folder?', 0], ['Fatima', 'the old one, not the new', 0]].map((m) => `<div style="justify-self:${m[2] ? 'end' : 'start'};max-width:80%;padding:11px 15px;border-radius:16px;background:${m[2] ? BLUE : '#F1F2FB'};color:${m[2] ? '#fff' : '#14163F'}"><span style="opacity:.6;font-size:13px">${m[0]}</span><br>${m[1]}</div>`).join('') + '</div>' },
  { id: 'acc', t: 'Old accounting app', dep: 'inv', fx: 520, fy: 520, rot: -2, w: 540, h: 380, body: () => '<div style="padding:0"><div style="height:46px;background:#2B2FA0;color:#fff;font:500 16px Inter;display:flex;align-items:center;padding:0 18px">41 bank lines unmatched</div>' + Array.from({ length: 6 }, (_, i) => `<div style="display:flex;justify-content:space-between;padding:13px 18px;border-bottom:1px solid #EEF0FF;font:400 16px Inter;color:#4A4F86"><span>${['Cheque 0041', 'Transfer Al Noor', 'POS settlement', 'VAT Q3', 'Cheque 0044', 'Refund'][i]}</span><b style="font-weight:500;color:#14163F">${(700 + i * 413).toLocaleString('en-US')}</b></div>`).join('') + '</div>' },
  { id: 'mail', t: 'Mail', dep: 'sal', fx: 1010, fy: 600, rot: 4, w: 520, h: 370, body: () => '<div>' + [['Statement of account: October', '3 invoices open, 1 overdue', 1], ['Re: can you confirm the PO number?', 'Al Noor Trading', 1], ['Quote 118 revised', 'Sent to Gulf Pack', 0], ['Out of office', 'Back on Monday', 0]].map((m) => `<div style="padding:15px 20px;border-bottom:1px solid #EEF0FF"><div style="font:${m[2] ? 600 : 400} 17px Inter;color:#14163F">${m[0]}</div><div style="font:400 15px Inter;color:#7B7FA6;margin-top:3px">${m[1]}</div></div>`).join('') + '</div>' },
  { id: 'bank', t: 'Bank portal', dep: 'pur', fx: 1380, fy: 470, rot: -3, w: 470, h: 380, body: () => `<div style="padding:22px"><div style="font:400 15px Inter;color:#7B7FA6">Current account</div><div style="font:500 44px 'Inter Tight';letter-spacing:-.04em;margin:4px 0 14px">AED 312,480</div>` + ['3 cheques cleared', 'New beneficiary added', 'WPS file rejected'].map((r) => `<div style="padding:12px 0;border-top:1px solid #EEF0FF;font:400 16px Inter;color:#4A4F86">${r}</div>`).join('') + '</div>' },
].map((a) => { const d = DEP.find((x) => x.id === a.dep); return { ...a, dx: d.x, dy: d.y, dw: d.w, dh: d.h }; });
const appEls = {};
APPS.forEach((a) => {
  appEls[a.id] = el(`<div class="win" id="app-${a.id}" style="width:${a.w}px;height:${a.h}px"><div class="tb"><i></i><i></i><i></i><span style="margin-left:8px">${a.t}</span></div><div>${a.body()}</div><div class="bdg" style="position:absolute;right:16px;top:8px;font:500 14px Inter;color:#fff;background:${VIO};border-radius:999px;padding:3px 10px">0</div></div>`);
});

/* ---- Ch3: the notification pile ---- */
const NOTES = [
  ['sheet', 'Spreadsheet · 08:30', 'Cash flow: November tab updated', '99+'], ['calc', 'Old accounting app · now', '41 bank lines unmatched', '47'], ['bank', 'Bank portal · 09:12', '3 cheques cleared', '23'],
  ['tasks', 'Tasks · 09:41', 'Due Thursday: stock take', '12'], ['folder', 'Drive · 2m', 'Contract_v3_final.pdf was shared', '8'], ['mail', 'Mail · 07:58', 'Statement of account: October', '31'],
  ['chat', 'Chat · 09:20', 'Fatima: visa photos needed by noon', '9'], ['cal', 'Calendar · 09:12', 'Month-end review moved to 16:00', '3'], ['sheet', 'Spreadsheet · now', 'Overtime sheet: 4 rows highlighted', '17'],
  ['tasks', 'Tasks · 08:20', '7 tasks moved to next week', '22'], ['mail', 'Mail · 09:02', 'Re: can you confirm the PO number?', '14'], ['calc', 'Old accounting app · 09:33', 'VAT export needs a re-run', '2'],
  ['folder', 'Drive · 09:41', '3 people edited Tender response', '18'], ['chat', 'Chat · 09:38', 'Price list (copy) was shared', '47'], ['bank', 'Bank portal · 09:38', 'New beneficiary added', '1'],
  ['pos', 'Point of sale · 08:55', 'Daily sales report', '312'], ['mail', 'Mail · 09:44', 'Invoice 0412 overdue', '6'], ['tasks', 'Tasks · 09:46', 'Reconcile Store 1 and Store 2', '5'],
  ['chat', 'Chat · 09:47', 'Who has the new laptop?', '11'], ['bank', 'Bank portal · 09:50', 'WPS file rejected', '1'], ['folder', 'Drive · 09:52', 'HR / Visas 2026 moved', '5'], ['sheet', 'Spreadsheet · 09:53', 'Price list (copy 2)', '4'],
];
const NCK = { 2: 'n0', 6: 'n1', 4: 'n2', 9: 'n3', 7: 'n4', 11: 'n5' };
const NC = NOTES.map((n, i) => {
  const e = el(`<div class="ncard"><div class="nic">${ico(P[n[0]], 24)}</div><div><small>${n[1]}</small><b>${n[2]}</b></div><em>${n[3]}</em></div>`);
  const col = i % 3, row = Math.floor(i / 3);
  // pile rests across the screen; a few rest near the right where they entered
  const rx = 160 + col * 560 + (hash(i + 2) - 0.5) * 140, ry = 380 + row * 100 + (hash(i + 7) - 0.5) * 50;
  return { e, rx, ry, rot: (hash(i + 17) - 0.5) * 10, t0: 22.6 + i * 0.5, i };
});

/* ---- Ch4: connectors between systems and the ONE node ---- */
const nodeXY = [[380, 660], [720, 920], [1240, 920], [1580, 660], [1480, 330]]; // kept clear of the headline (top left)
const NODEN = ['Finance', 'People', 'Inventory', 'Sales', 'Purchasing'];
const svgNS = 'http://www.w3.org/2000/svg';
const conn = document.createElementNS(svgNS, 'svg');
conn.setAttribute('width', W); conn.setAttribute('height', H); conn.style.cssText = 'position:absolute;left:0;top:0';

    c2.innerHTML = lab('Needs you') + `<div style="margin-top:26px;display:flex;align-items:center;gap:14px"><div style="width:56px;height:56px;border-radius:17px;background:#EEF0FF;display:grid;place-items:center">${ico(P.pay, 30)}</div><div style="font:400 24px 'Space Grotesk';color:#6A6E9A">Payroll · 09:41</div></div><div style="margin-top:22px">${swap('1 employee is missing bank details', 'Bank details added', 44, INK, 100)}</div>${swap2('The WPS run is due on 25 Nov', 'The WPS run is ready for 25 Nov')}<div id="reviewBtn" style="position:absolute;left:44px;bottom:44px;width:210px;height:68px;border-radius:999px;background:${INK};color:#fff;overflow:hidden;font:500 28px 'Inter Tight'"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:scale(${1 - 0.06 * Math.exp(-Math.abs(t - T_CLICK.review) * 12)})">Review</div><div style="position:absolute;inset:0;background:#2DBE7E;display:flex;align-items:center;justify-content:center;gap:10px;clip-path:inset(0 ${(1 - done) * 100}% 0 0)">${ico(P.check, 26, '#fff', 2.6)}Done</div></div>`;
  }
  /* Ch7 brand */
  brand.style.display = t > 77.2 ? 'block' : 'none';
  if (t > 77.2) {
    const lg = eio(seg(t, 77.4, 78.4)), lw = $('#logoWrap');
    lw.style.clipPath = circ(lg, 120, 165, 260);
    const ls = lerp(1, 1.0, eio(seg(t, 78.6, 79.6)));
    lw.style.transform = `translate(${lerp(0, 640, eio(seg(t, 78.6, 79.6)))}px,${lerp(0, -40, eio(seg(t, 78.6, 79.6)))}px) scale(${ls})`;
    const cta = $('#cta'); const cp = eo(seg(t, 81.0, 82.2)); cta.style.opacity = cp; cta.style.transform = `translateY(${(1 - cp) * 40}px)`;
  }

  /* copy blocks */
  copyEls.forEach(({ c, n, lns }) => {
    n.style.display = t >= c.t0 - 0.05 && t <= c.t1 + 0.8 ? 'block' : 'none';
    if (n.style.display === 'none') return;
    const dark = bgIsDark(t, c);
    lns.forEach((s, i) => {
      const pin = expo(seg(t, c.t0 + i * 0.18, c.t0 + i * 0.18 + 0.7));
      const pout = eio(seg(t, c.t1 - 0.6 + i * 0.08, c.t1 + i * 0.08));
      s.style.transform = `translateY(${(1 - pin) * 112 + pout * -112}%)`;
      const isAcc = i >= c.acc; s.className = isAcc ? (dark ? 'ad' : 'al') : ''; if (!isAcc) s.style.color = dark ? '#fff' : INK;
    });
  });

  /* cursor + ripples */
  const cpos = curPos(t);
  const showCur = t > 0.0 && t < 78.2;
  cursorEl.style.display = showCur ? 'block' : 'none';
  let cs2 = 1; window.CLICKS.forEach((ck) => { if (t >= ck && t < ck + 0.3) cs2 = 1 - 0.14 * Math.sin(Math.PI * (t - ck) / 0.3); });
  const morph = eio(seg(t, 76.9, 77.7));
  cursorEl.style.transform = `translate(${cpos[0]}px,${cpos[1]}px) scale(${cs2 * (1 - morph * 0.9)})`;
  cursorEl.style.opacity = 1 - seg(t, 77.4, 77.9);
  let rhtml = '';
  window.CLICKS.forEach((ck) => { if (t >= ck && t < ck + 0.7) { const p = seg(t, ck, ck + 0.7), pp = cpos; rhtml += `<div class="ripple" style="left:${pp[0] - 60 * eo(p)}px;top:${pp[1] - 60 * eo(p)}px;width:${120 * eo(p)}px;height:${120 * eo(p)}px;opacity:${1 - p}"></div>`; } });
  ripEl.innerHTML = rhtml;
}
function bgIsDark(t, c) { if (c.id === 'c1') return false; if (c.id === 'c6') return false; if (c.id === 'c2') return t > 12.9; return true; }

window.seek = (t) => { render(t); };
window.DUR = DUR;
Promise.all([fetch('modules.json').then((r) => r.json()), fetch('logo.svg').then((r) => r.text()), document.fonts.load('italic 400 40px "Instrument Serif"'), document.fonts.load('500 40px "Inter Tight"'), document.fonts.load('500 20px "Space Grotesk"'), document.fonts.ready]).then(([m, lg]) => {
  MODS = m;
  const inner = lg.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
  LOGO = inner.replace(/lg-([abc])/g, 'lgf-$1'); buildBrand();
  window.READY = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) window.seek(parseFloat(q.get('t')));
});
})();
